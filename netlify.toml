[build]
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self), screen-wake-lock=(self)"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
